<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6e4e5">
<title>りなへ ♡</title>
<style>
:root{
  --ink:#5c424c;--rose:#b76f80;--paper:#fffaf7;--line:#ead2d6;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#f6e4e5;color:var(--ink);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  overscroll-behavior:none;
}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.app{
  width:100%;height:100svh;height:100dvh;
  min-height:500px;display:flex;flex-direction:column;
  align-items:center;overflow:hidden;
  padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));
}
.top{
  width:min(100%,560px);height:28px;flex:0 0 28px;
  display:flex;align-items:center;justify-content:space-between;
  color:#9b717c;font-size:10px;letter-spacing:.1em;padding:0 3px;
}
.progress{display:flex;gap:4px;align-items:center}
.progress i{width:12px;height:3px;border-radius:5px;background:#e7cbd0}
.progress i.on{background:var(--rose)}
.card{
  width:min(100%,560px);height:calc(100% - 28px);
  min-height:0;background:var(--paper);
  border:1px solid #efdfe1;border-radius:20px 20px 14px 14px;
  box-shadow:0 10px 30px rgba(95,63,73,.12);
  overflow:hidden;display:flex;flex-direction:column;
}
.art{
  position:relative;flex:0 0 27svh;height:27svh;min-height:125px;max-height:250px;
  overflow:hidden;background:#ead9df;
  display:flex;align-items:center;justify-content:center;
}
.art::before{
  content:"";position:absolute;inset:-18px;
  background-image:var(--art-bg);
  background-size:cover;background-position:center;
  filter:blur(14px);transform:scale(1.08);opacity:.48;
}
.art img{
  position:relative;z-index:1;width:100%;height:100%;
  display:block;object-fit:contain;object-position:center;
}
.art:after{
  content:"";position:absolute;inset:0;z-index:2;
  background:linear-gradient(to bottom,transparent 65%,rgba(54,31,41,.12));
  pointer-events:none;
}
.content{
  flex:1;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:10px clamp(13px,4.5vw,30px) 5px;
  animation:fade .35s ease;
}
.eyebrow{
  flex:0 0 auto;margin:0 0 4px;color:#b17d89;
  font-size:10px;letter-spacing:.12em;
}
h1{
  flex:0 0 auto;margin:0 0 8px;font-weight:500;
  font-size:clamp(20px,5.8vw,29px);line-height:1.2;
}
.copy{
  flex:0 1 auto;max-width:520px;margin:0;
  color:#67515a;font-size:clamp(12.4px,3.25vw,15px);
  line-height:1.55;white-space:pre-line;
}
.vn{
  flex:0 1 auto;max-width:520px;margin:7px 0 0;
  color:#a35f72;font:italic clamp(11px,2.9vw,13px)/1.45 Georgia,serif;
}
.actions{
  flex:0 0 auto;width:min(100%,560px);display:flex;gap:9px;
  justify-content:center;padding:6px 12px max(8px,env(safe-area-inset-bottom));
}
.actions button{
  min-width:100px;padding:9px 18px;border-radius:24px;
  border:1px solid var(--line);background:#fff7f5;color:#805564;
  font-size:12px;box-shadow:0 4px 12px rgba(100,60,75,.06);
}
.actions button.primary{background:#b97888;color:white;border-color:#b97888}
.actions button:disabled{opacity:.28}
.language-change{display:none;margin:10px auto 0;border:1px solid var(--line);border-radius:999px;background:rgba(255,250,247,.82);color:#8a5968;padding:7px 15px;font-size:11px;box-shadow:0 4px 12px rgba(100,60,75,.05)}
.language-change.show{display:block}
.chapter-progress span{width:5px;height:5px;border-radius:50%;background:#dcc2c9}
.chapter-progress span.active{width:14px;border-radius:5px;background:#a96b7c}

.letter-page .content{
  background:
    linear-gradient(rgba(255,250,247,.58),rgba(255,250,247,.76)),
    url("images/07-letter.jpg") center/cover no-repeat;
  padding-left:12px;padding-right:12px;
}
.letter-page .copy{
  width:min(100%,500px);
  background:rgba(255,250,247,.72);
  border:1px solid rgba(255,255,255,.72);
  border-radius:18px;padding:10px 13px;
  box-shadow:0 7px 20px rgba(80,50,60,.07);
  backdrop-filter:blur(2px);
}
.letter-page .vn{
  background:rgba(255,250,247,.72);border-radius:12px;padding:5px 9px;
}

.letter-overlay{
  position:fixed;inset:0;z-index:1000;
  display:grid;place-items:center;overflow:hidden;
  background:
    radial-gradient(circle at 50% 30%,rgba(255,250,247,.8),transparent 38%),
    linear-gradient(145deg,#f6dfe3,#f7eadf 48%,#e8dbe7);
  transition:opacity .65s ease,visibility .65s ease;
}
.letter-overlay.hide{opacity:0;visibility:hidden;pointer-events:none}
.envelope-wrap{text-align:center;position:relative;z-index:2}
.envelope{
  width:min(68vw,285px);height:min(44vw,180px);position:relative;margin:0 auto 17px;
  background:#fff8f4;border-radius:12px;
  box-shadow:0 18px 38px rgba(98,63,73,.18);
  transform:rotate(-1deg);transition:transform .6s ease;
}
.envelope-flap{
  position:absolute;inset:0;background:#f0cbd2;
  clip-path:polygon(0 0,100% 0,50% 62%);
  border-radius:12px 12px 0 0;transform-origin:top center;
  transition:transform .75s ease;z-index:4;
}
.envelope-heart{position:absolute;z-index:5;left:50%;top:49%;
  transform:translate(-50%,-50%);font-size:38px;color:#a95f75}
.envelope-paper{
  position:absolute;left:8%;right:8%;bottom:8%;height:72%;
  background:#fffaf6;border-radius:8px;padding:13px;
  color:#77515c;font-size:11px;z-index:2;
}
.envelope-paper strong{display:block;font-size:20px;margin-top:7px;color:#633d49}
.envelope-wrap.opening .envelope-flap{transform:rotateX(180deg)}
.envelope-wrap.opening .envelope{transform:translateY(-12px) scale(1.02)}
.overlay-title{font-size:13px;letter-spacing:.15em;color:#7c5660;margin-bottom:3px}
.overlay-subtitle{font-size:25px;color:#5e3d49;margin-bottom:13px}
.letter-overlay button{
  border:0;border-radius:999px;padding:11px 24px;
  background:#fff8f4;color:#754a57;font-size:12px;
  box-shadow:0 7px 18px rgba(80,50,60,.12)
}
.petal{position:absolute;font-size:18px;opacity:.65;animation:petalFloat 6s ease-in-out infinite}
.p1{left:12%;top:18%}.p2{right:15%;top:29%;animation-delay:1.5s}.p3{left:24%;bottom:15%;animation-delay:3s}
@keyframes petalFloat{50%{transform:translate(18px,24px) rotate(25deg);opacity:.9}100%{transform:translate(-4px,45px) rotate(-15deg);opacity:.2}}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

@media(max-height:700px){
  .art{flex-basis:23svh;height:23svh;min-height:110px}
  .content{padding-top:7px}
  h1{font-size:20px;margin-bottom:5px}
  .copy{font-size:12.1px;line-height:1.43}
  .vn{font-size:10.5px;line-height:1.35;margin-top:5px}
  .actions button{padding:8px 16px}
}
@media(min-width:700px){
  .app{padding:18px}
  .top{height:30px;flex-basis:30px}
  .card{height:calc(100% - 30px)}
  .art{flex-basis:240px;height:240px}
  .copy{font-size:15px;line-height:1.65}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.language-overlay{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 20%,rgba(255,250,247,.95),transparent 38%),linear-gradient(145deg,#f6dfe3,#f7eadf 48%,#e8dbe7);transition:opacity .55s ease,visibility .55s ease;padding:20px}.language-overlay.hide{opacity:0;visibility:hidden;pointer-events:none}.lang-card{width:min(92vw,390px);text-align:center;background:rgba(255,250,247,.86);border:1px solid rgba(255,255,255,.85);border-radius:24px;padding:34px 24px 26px;box-shadow:0 18px 45px rgba(95,63,73,.14);backdrop-filter:blur(8px)}.lang-small{color:#b17d89;font-size:11px;letter-spacing:.15em;margin-bottom:8px}.lang-title{font-size:34px;color:#5c424c;margin-bottom:24px}.lang-question{font-size:14px;line-height:1.7;color:#67515a;margin-bottom:16px}.lang-card select{width:100%;appearance:auto;border:1px solid #e7cbd0;border-radius:14px;background:#fffaf7;color:#6c4b56;padding:13px 14px;font-size:14px;margin-bottom:12px}.lang-card button{width:100%;border:0;border-radius:999px;background:#b97888;color:#fff;padding:12px 18px;font-size:13px;box-shadow:0 7px 18px rgba(80,50,60,.12)}.lang-note{font-size:10px;color:#a47b86;margin-top:12px}.lang-petal{position:absolute;left:15%;top:18%;font-size:22px;opacity:.65;animation:petalFloat 6s ease-in-out infinite}.lang-petal.p2{left:auto;right:14%;top:65%;animation-delay:1.4s}.letter-overlay.hidden{display:none}.letter-overlay{opacity:1}.letter-overlay.hide{opacity:0;visibility:hidden;pointer-events:none}
</style>
</head>
<body>
<div id="languageOverlay" class="language-overlay">
  <div class="lang-petal">🌸</div><div class="lang-petal p2">🌸</div>
  <div class="lang-card">
    <div class="lang-small">小さな物語</div>
    <div class="lang-title" id="langTitle">リナへ ♡</div>
    <div class="lang-question" id="langQuestion">この物語を、どの言葉で読みますか？♡</div>
    <select id="languageSelect" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="vi">Tiếng Việt</option>
      <option value="en">English</option>
    </select>
    <button id="startStory">この言葉で読む ♡</button>
    <div class="lang-note" id="langNote">あとからいつでも変更できます。</div>
  </div>
</div>

<div id="letterOverlay" class="letter-overlay hidden">
  <div class="petal p1">🌸</div><div class="petal p2">🌸</div><div class="petal p3">🌸</div>
  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope">
      <div class="envelope-flap"></div><div class="envelope-heart">♡</div>
      <div class="envelope-paper"><div id="envSmall">小さな手紙</div><strong id="envTitle">リナへ ♡</strong></div>
    </div>
    <div class="overlay-title" id="envCaption">小さな手紙</div>
    <div class="overlay-subtitle" id="envRecipient">リナへ ♡</div>
    <button id="openLetter">開いてみて ♡</button>
  </div>
</div>

<div class="app">
  <div class="top"><div id="count">01 / 07</div><div class="progress" id="progress"></div></div>
  <main class="card">
    <div class="art"><img id="artImage" alt=""><div class="caption" id="caption"></div></div>
    <div class="chapter-progress" id="chapterProgress"></div>
    <section class="content" id="content">
      <p class="eyebrow" id="eyebrow"></p><h1 id="heading"></h1>
      <p class="copy" id="copy"></p><p class="vn" id="accent"></p>
      <button id="languageChange" class="language-change"></button>
    </section>
    <div class="actions"><button id="back"></button><button id="next" class="primary"></button></div>
  </main>
</div>

   {title:'11月29日 ♡',text:'今日は、私の誕生日。\nそして、私たちが初めてゆっくり話す日。\n一緒にランチかディナーを楽しんで、\n素敵な日本の神社にも行けたら嬉しいです。♡\nそして、今日という日に\n私たちの最初の思い出を作れたら嬉しいです。\n\nあなたとゆっくり話せることを、\n今から楽しみにしています。\nきっと今日が、\n私たちの物語の新しいページになると思います。♡',image:'images/04-shrine.jpg',caption:'私の誕生日 · 特別な一日'},
   {title:'少しずつ、もっと知りたい',text:'毎日話して、あなたのことを少しずつ知って、\nもっと知りたいと思うようになりました。\nあなたの笑顔。あなたの瞳。\nそして、あなたと話している時間。\nその一つひとつが、いつの間にか私にとって\n大切なものになっていました。♡\nもしよかったら、これから少しずつ、\nお互いのことを知ることができたら嬉しいです。♡',image:'images/05-walk.jpg',caption:'少しずつ、あなたのことを'},
   {title:'リナへ ♡',text:'私たちが出会えたこと、\nそして、こうして毎日話せるようになったこと。\nそれは、私にとってとても素敵なことです。♡\n国も、育った場所も違う私たちが、\n日本で出会って、こうして少しずつお互いを知っていく。\nなんだか、不思議で素敵なことだと思います。\nこれからも、たくさん話して、たくさん笑って、\n一緒に素敵な思い出を作っていけたら嬉しいです。',image:'images/07-letter.jpg',caption:'小さな手紙'},
   {title:'これからの物語',eyebrow:'最後に、ひとつだけ ♡',text:'リナ、あなたと出会えて、本当に嬉しいです。♡\nまだ始まったばかりの私たちだけど、\nこれから少しずつ、一緒に素敵な思い出を作っていけたら嬉しいです。\n\nそして、今日が私たちにとって忘れない一日になりますように。\nこれから、どんな物語になるのか楽しみです。♡\n\nディワカル ♡ リナ\n次の章を書きましょう。♡',image:'images/06-final.jpg',caption:'ディワカル ♡ リナ'}

   {title:'November 14 ♡',text:'On this day, you came to the ramen shop where I work.\nWe both knew the other person was there.\nBut we were too shy to even say “hello.” ♡\nI quietly watched you sitting at the corner table.\n\nIt was only a short moment,\nbut it became a moment I will never forget.',image:'images/03-ramen.jpg',caption:'That day at the ramen shop'},
   {title:'November 29 ♡',text:'Today is my birthday.\nAnd it is the day we finally get to talk properly for the first time.\nI would love to enjoy lunch or dinner together\nand, if we can, visit a beautiful Japanese shrine. ♡\nI hope we can make our first special memory today.\n\nI’m really looking forward to talking with you slowly and comfortably.\nI feel that today might become a new page in our story. ♡',image:'images/04-shrine.jpg',caption:'My birthday · A special day'},
   {title:'I Want to Know You, Little by Little',text:'After talking every day and getting to know you little by little,\nI started wanting to know you even more.\nYour smile. Your eyes.\nAnd the time I spend talking with you.\nSomehow, each of these has become something precious to me. ♡\nIf you are comfortable with it,\nI would be happy if we could slowly get to know each other better. ♡',image:'images/05-walk.jpg',caption:'Getting to know you, little by little'},

let lang='ja', index=0;
const $=id=>document.getElementById(id);
function applyLanguage(){
 const t=T[lang];
 document.documentElement.lang=lang;
 $('langQuestion').textContent=t.question;$('langTitle').textContent=t.title;$('startStory').textContent=t.start;$('langNote').textContent=t.note;
 $('back').textContent=t.back;$('next').textContent=t.next;$('openLetter').textContent=t.open;$('languageChange').textContent=t.change;
 $('envSmall').textContent=t.small;$('envTitle').textContent=t.recipient;$('envCaption').textContent=t.small;$('envRecipient').textContent=t.recipient;
 render();
}
function render(){
 const t=T[lang],c=t.c[index];
 document.title=t.recipient;
 $('count').textContent=String(index+1).padStart(2,'0')+' / '+String(t.c.length).padStart(2,'0');
 $('progress').innerHTML=t.c.map((_,i)=>`<i class="${i<=index?'on':''}"></i>`).join('');
 $('chapterProgress').innerHTML=t.c.slice(1).map((_,i)=>`<span class="${i===Math.max(0,index-1)?'active':''}"></span>`).join('');
 $('eyebrow').textContent=c.eyebrow||'';$('eyebrow').style.display=c.eyebrow?'block':'none';
 $('heading').textContent=c.title;$('copy').textContent=c.text;
 $('accent').textContent=c.accent||'';$('accent').style.display=c.accent?'block':'none';
 $('languageChange').classList.toggle('show',index===t.c.length-1);
 $('artImage').src=c.image;$('artImage').alt=c.caption||'';$('caption').textContent=c.caption||'';
 $('back').disabled=index===0;$('next').textContent=index===t.c.length-1?t.restart:(c.button||t.next);
 document.querySelector('.art').style.setProperty('--art-bg',`url("${c.image}")`);
 document.querySelector('.content').style.animation='none';void document.querySelector('.content').offsetWidth;document.querySelector('.content').style.animation='';
}
$('languageSelect').onchange=e=>{lang=e.target.value;applyLanguage()};
$('languageChange').onclick=()=>{ $('languageOverlay').classList.remove('hide'); $('languageSelect').value=lang; };
$('startStory').onclick=()=>{$('languageOverlay').classList.add('hide');$('letterOverlay').classList.remove('hidden');applyLanguage()};
$('openLetter').onclick=()=>{$('envelopeWrap').classList.add('opening');setTimeout(()=>$('letterOverlay').classList.add('hide'),650)};
$('next').onclick=()=>{const t=T[lang];index=index===t.c.length-1?0:index+1;render()};
$('back').onclick=()=>{if(index>0){index--;render()}};
applyLanguage();
</script>
